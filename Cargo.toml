[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Engine crates.
eng-core = { path = "crates/eng-core" }
eng-math = { path = "crates/eng-math" }
eng-schema-core = { path = "crates/eng-schema-core" }
eng-derive = { path = "crates/eng-derive" }
eng-ecs = { path = "crates/eng-ecs" }
eng-sim = { path = "crates/eng-sim" }
eng-net-transport = { path = "crates/eng-net-transport" }
eng-collision-api = { path = "crates/eng-collision-api" }
kit-fps = { path = "crates/kit-fps" }
eng-schema-json = { path = "crates/eng-schema-json" }
eng-input = { path = "crates/eng-input" }
eng-platform-headless = { path = "crates/eng-platform-headless" }
eng-cli = { path = "crates/eng-cli" }
game-testbed-sim = { path = "crates/game-testbed-sim" }
eng-platform-api = { path = "crates/eng-platform-api" }
eng-platform-winit = { path = "crates/eng-platform-winit" }
eng-net-wire = { path = "crates/eng-net-wire" }
eng-session = { path = "crates/eng-session" }
eng-gpu = { path = "crates/eng-gpu" }
eng-render = { path = "crates/eng-render" }
eng-app = { path = "crates/eng-app" }
eng-collision-grid = { path = "crates/eng-collision-grid" }
game-testbed-client = { path = "crates/game-testbed-client" }
eng-bench = { path = "crates/eng-bench" }
eng-platform-gcmouse = { path = "crates/eng-platform-gcmouse" }

# Third-party crates. New entries need the owner's approval (deny.toml allow-list).
# `force-soft-floats` keeps libm's `arch` code off even when another crate
# turns the feature on, as wgpu's naga does (architecture.toml).
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The window seam (ADR-0016): only eng-platform-api, eng-platform-winit,
# eng-gpu and eng-app may depend on it (gate G3's wrapper ban).
raw-window-handle = "=0.6.2"
# Batch 2 (rung 1b). wgpu only in eng-gpu ([floor] in architecture.toml), with
# plan decision 5's features. naga is wgpu's own shader compiler, at wgpu's
# version; eng-gpu's shader test uses its WGSL front end and three back ends.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "metal", "vulkan", "wgsl"] }
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }
# winit only in eng-platform-winit ([floor]), with plan decision 5's features:
# raw-window-handle 0.6 for the window seam, X11 and Wayland loaded at run
# time, and no client-side decorations on Wayland.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# PNG and APNG for eng-cli's `shot` and `video` (plan difference 5), and for
# decoding them in tests. It has no default features.
png = "=0.18.1"
# FLIP (NVIDIA's perceptual image difference) for the testbed's golden shots
# off the pinned configuration (plan decision 3). Tests only: nv-flip-sys
# compiles FLIP's C++ through `cc`.
nv-flip = "=0.1.2"
# Batch 3 (rung 2). The Game Controller bindings, only in the GCMouse shim,
# eng-platform-gcmouse ([floor], and deny.toml's wrapper ban), on macOS only,
# with the plan's features ("Crate batch 3"). block2 and objc2 (batch 2,
# already in the graph through winit and wgpu) name the shim's handler block
# and the objects it keeps.
objc2-game-controller = { version = "=0.3.2", default-features = false, features = ["std", "block2", "GCDevice", "GCMouse", "GCMouseInput", "GCPhysicalInputProfile"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
# Batch 3 (rung 2). Instruction counts under valgrind for eng-bench, a
# dev-dependency on Linux only; `gungraun-runner` (CI's bench job) must be
# the same version.
gungraun = "=0.20.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# forbid, not deny: no #[allow] or lint group can switch them off (spec 6.4).
disallowed_methods = "forbid"
disallowed_types = "forbid"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Overflow checks stay on in release builds for the core set (spec 6.4).
# `cargo xtask arch-check` fails if a core crate is missing here.
[profile.release.package.eng-core]
overflow-checks = true
[profile.release.package.eng-math]
overflow-checks = true
[profile.release.package.eng-schema-core]
overflow-checks = true
[profile.release.package.eng-ecs]
overflow-checks = true
[profile.release.package.eng-sim]
overflow-checks = true
[profile.release.package.eng-net-transport]
overflow-checks = true
[profile.release.package.eng-collision-api]
overflow-checks = true
[profile.release.package.kit-fps]
overflow-checks = true
[profile.release.package.game-testbed-sim]
overflow-checks = true
[profile.release.package.eng-net-wire]
overflow-checks = true
[profile.release.package.eng-session]
overflow-checks = true
[profile.release.package.eng-collision-grid]
overflow-checks = true
