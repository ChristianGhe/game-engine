# Determinism bans (spec 6.4). Denied through `[workspace.lints.clippy]`.
# `allow-invalid` keeps an entry valid on targets or crates where the path
# does not resolve (most float math is absent from `core`).

disallowed-methods = [
  # std's min/max/clamp may return either signed zero.
  { path = "f32::min", reason = "use eng_math::min" },
  { path = "f32::max", reason = "use eng_math::max" },
  { path = "f32::clamp", reason = "use eng_math::clamp" },
  { path = "f64::min", reason = "use eng_math::min_f64" },
  { path = "f64::max", reason = "use eng_math::max_f64" },
  { path = "f64::clamp", reason = "use eng_math::clamp_f64" },
  { path = "f32::minimum", reason = "use eng_math::min", allow-invalid = true },
  { path = "f32::maximum", reason = "use eng_math::max", allow-invalid = true },
  # Degree conversions: the simulation uses binary angles (eng_math::BAngle).
  { path = "f32::to_radians", reason = "use eng_math::BAngle" },
  { path = "f32::to_degrees", reason = "use eng_math::BAngle" },
  { path = "f64::to_radians", reason = "use eng_math::BAngle" },
  { path = "f64::to_degrees", reason = "use eng_math::BAngle" },
  # Fused and reassociating arithmetic changes results between targets.
  { path = "f32::mul_add", reason = "never fuse a*b+c; write it out", allow-invalid = true },
  { path = "f64::mul_add", reason = "never fuse a*b+c; write it out", allow-invalid = true },
  { path = "f32::algebraic_add", reason = "reassociating math is not deterministic", allow-invalid = true },
  { path = "f32::algebraic_sub", reason = "reassociating math is not deterministic", allow-invalid = true },
  { path = "f32::algebraic_mul", reason = "reassociating math is not deterministic", allow-invalid = true },
