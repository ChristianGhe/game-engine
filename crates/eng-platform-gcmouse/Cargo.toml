[package]
name = "eng-platform-gcmouse"
description = "The GCMouse shim: raw mouse deltas on macOS from the Game Controller framework, for the winit platform. Empty elsewhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

# Only `src/macos.rs` uses them (ADR-0021).
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-game-controller.workspace = true

[dev-dependencies]
proptest.workspace = true

# GCMouse's source starts only on the main thread, so the test of the real
# shim is a harness of its own.
[[test]]
name = "start"
harness = false

[lints]
workspace = true
