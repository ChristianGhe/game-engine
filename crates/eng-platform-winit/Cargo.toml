[package]
name = "eng-platform-winit"
description = "The desktop platform: winit windows and input behind the platform contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eng-platform-api.workspace = true
# The window seam (ADR-0016): the window handed to the app implements the
# two handle traits by passing winit's through. Never re-exported.
raw-window-handle.workspace = true
winit.workspace = true

# winit's event loop needs the main thread on macOS and exists once per
# process, so the windowed checks are a harness of their own.
[[test]]
name = "conformance"
harness = false

[lints]
workspace = true
