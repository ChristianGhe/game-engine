# cargo-deny (spec 4, 6.2): licences, bans, sources, advisories.
# PROTECTED: the owner approves changes, in batches (AGENTS.md).

[graph]
all-features = false
# The targets whose whole workspace we build. wasm32 is left out on purpose:
# CI builds only the core set for it, which reaches nothing but libm, while
# winit would add web-only crates to the graph.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "riscv64gc-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The exact SPDX allow-list for anything in the binaries we build. Never GPL
# or AGPL. MPL-2.0 is allowed only for unmodified crates, through a per-crate
# exception; CDLA-Permissive-2.0 only if rustls is ever used.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
# Our own crates are unpublished; their licence is the workspace's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Our own crates; the allow-list below is for third-party crates.
allow-workspace = true
# Each floor crate is wrapped by exactly one engine crate (spec 6.2 rule 2).
deny = [
  { crate = "wgpu", wrappers = ["eng-gpu"] },
  { crate = "winit", wrappers = ["eng-platform-winit"] },
  { crate = "gilrs", wrappers = ["eng-platform-winit"] },
  { crate = "cpal", wrappers = ["eng-audio-cpal"] },
  # The window-handle traits stay inside the window seam (ADR-0016): the
  # floor crates that use them directly, and the four seam crates.
  { crate = "raw-window-handle", wrappers = [
    "wgpu", "wgpu-core", "wgpu-hal", "wgpu-types", "winit",
    "eng-platform-api", "eng-platform-winit", "eng-gpu", "eng-app",
  ] },
  # Unmaintained (spec 6.8).
  { crate = "laminar" },
  { crate = "bincode" },
]
# The third-party allow-list: only these crates may appear in the dependency
# graph of these targets (see [graph]).
# Batch 1, approved by the owner on 2026-10-24 for rung 1a:
# libm (core math), syn/quote/proc-macro2/unicode-ident (eng-derive),
# serde/toml/serde_json and their dependencies (authored data, xtask, tests),
# proptest and its dependencies (property tests). Some appear only on
# other targets (r-efi, getrandom) or through optional features.
# Batch 2, approved by the owner on 2026-10-31 for rung 1b ("Crate batch 2"
# in docs/rungs/1b/plan.md): wgpu and winit with their platform crates, png
# (shots, the proof video, goldens) and nv-flip (golden comparison in tests).
# Some are never built: cargo-deny tests each platform-gated edge against
# every target above. wgpu, winit and raw-window-handle are also in `deny`
# with their wrappers, and cargo-deny refuses the same spec in both lists, so
# here they are written `name:*` (any release version).
allow = [
  "autocfg",
  "bitflags",
  "cfg-if",
  "chacha20",
  "core_detect",
