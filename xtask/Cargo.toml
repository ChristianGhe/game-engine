[package]
name = "xtask"
description = "The only entry point for checks, CI jobs and agent hooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Pinned here, not through [workspace.dependencies]: this crate is protected,
# the root manifest's dependency table is not, and the checker must not be
# rewired from outside.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[lints]
workspace = true
